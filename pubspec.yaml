name: aj_stocks
description: A new Flutter project for tracking stock delivery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.1.0
  firebase_database: ^11.0.0
  intl: ^0.18.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  google_fonts: ^6.1.0
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  csv: ^6.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.1
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
